[tool.poetry]
name = "gitdevflow"
version = "0.1.0"
description = "A CLI tool for streamlining Git-based development workflows"
authors = ["Your Name <your.email@example.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/BlockForge-Dev/gitdevflow"
repository = "https://github.com/BlockForge-Dev/gitdevflow"
documentation = "https://BlockForge-Dev.github.io/gitdevflow/"
keywords = ["git", "cli", "developer-tools", "pull-request", "changelog"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
]
packages = [{ include = "gitdevflow", from = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
typer = { version = "^0.15.0", extras = ["all"] }
rich = "^13.7"
httpx = { version = "^0.27", extras = ["http2"] }
pydantic = "^2.7"
pydantic-settings = "^2.3"
pyyaml = "^6.0"
python-dotenv = "^1.0"
tenacity = "^9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-asyncio = ">=0.23,<1.5"
pytest-cov = "^5.0"
pytest-mock = "^3.14"
respx = "^0.22.0"
ruff = "^0.7"
black = "^24.8"
mypy = "^1.12"
pre-commit = "^3.8"
types-PyYAML = "^6.0"
bump-my-version = "^0.26"
toml = "^0.10"

[tool.poetry.group.docs.dependencies]
mkdocs = "^1.6"
mkdocs-material = "^9.5"

[tool.poetry.scripts]
gitdevflow = "gitdevflow.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ── Ruff ────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
ignore = ["B008"]  # Allow typer.Option / typer.Argument in function defaults
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]

[tool.ruff.lint.isort]
known-first-party = ["gitdevflow"]

# ── Mypy ────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ── Pytest ──────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --cov=gitdevflow --cov-report=term-missing --cov-report=xml"

# ── Coverage ────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src/gitdevflow"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 85
